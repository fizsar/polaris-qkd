<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Secret key rate vs distance. Simulation · 10M photons/point · detector 10 % · noise 1.0 % · 1 GHz clock"><style>
:root{--bg:#ffffff;--fg:#191919;--mut:#666666;--grid:#e6e6e6;--axis:#b3b3b3;--accent:#257de0;--ref:#8a8a8a;--crit:#dc3c3d}
@media (prefers-color-scheme: dark){:root{--bg:#191919;--fg:#efefef;--mut:#9c9c9c;--grid:#2e2e2e;--axis:#555555;--accent:#338ced;--ref:#8f8f8f;--crit:#dc3c3d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg)}
.mut{fill:var(--mut)}.t{font-size:17px;font-weight:600}.s{font-size:12.5px}.tk{font-size:12px}.lb{font-size:12.5px;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.data{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ref{fill:none;stroke:var(--ref);stroke-width:1.5;stroke-dasharray:6 4}
.crit{stroke:var(--crit);stroke-width:1.5;stroke-dasharray:2 4}
.dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.accent{fill:var(--accent)}.reft{fill:var(--ref)}.critt{fill:var(--crit)}
</style><rect width="760" height="440" rx="8" fill="var(--bg)"/><text class="t" x="76" y="30">Secret key rate vs distance</text><text class="s mut" x="76" y="50">Simulation · 10M photons/point · detector 10 % · noise 1.0 % · 1 GHz clock</text><line class="grid" x1="76" x2="610" y1="376.0" y2="376.0"/><text class="tk mut" x="68" y="380.0" text-anchor="end">100 k</text><line class="grid" x1="76" x2="610" y1="276.7" y2="276.7"/><text class="tk mut" x="68" y="280.7" text-anchor="end">1 M</text><line class="grid" x1="76" x2="610" y1="177.3" y2="177.3"/><text class="tk mut" x="68" y="181.3" text-anchor="end">10 M</text><line class="grid" x1="76" x2="610" y1="78.0" y2="78.0"/><text class="tk mut" x="68" y="82.0" text-anchor="end">100 M</text><line class="axis" x1="76.0" x2="76.0" y1="376" y2="380"/><text class="tk mut" x="76.0" y="395" text-anchor="middle">0</text><line class="axis" x1="173.1" x2="173.1" y1="376" y2="380"/><text class="tk mut" x="173.1" y="395" text-anchor="middle">20</text><line class="axis" x1="270.2" x2="270.2" y1="376" y2="380"/><text class="tk mut" x="270.2" y="395" text-anchor="middle">40</text><line class="axis" x1="367.3" x2="367.3" y1="376" y2="380"/><text class="tk mut" x="367.3" y="395" text-anchor="middle">60</text><line class="axis" x1="464.4" x2="464.4" y1="376" y2="380"/><text class="tk mut" x="464.4" y="395" text-anchor="middle">80</text><line class="axis" x1="561.5" x2="561.5" y1="376" y2="380"/><text class="tk mut" x="561.5" y="395" text-anchor="middle">100</text><line class="axis" x1="76" x2="610" y1="376" y2="376"/><text class="s mut" x="343" y="422" text-anchor="middle">Fibre length (km)</text><text class="s mut" transform="translate(18 227) rotate(-90)" text-anchor="middle">Secret key rate (bit/s, log scale)</text><polyline class="ref" points="76.0,121.1 124.5,141.0 173.1,160.8 221.6,180.7 270.2,200.6 318.7,220.4 367.3,240.3 415.8,260.2 464.4,280.0 512.9,299.9 561.5,319.8 610.0,339.6"/><text class="lb reft" x="619.0" y="322.5">∝ fibre loss η</text><polyline class="data" points="76.0,121.1 124.5,141.1 173.1,161.2 221.6,181.6 270.2,201.4 318.7,221.5 367.3,241.7 415.8,260.6 464.4,282.8 512.9,305.8 561.5,321.6 610.0,354.5"/><circle class="dot" cx="76.0" cy="121.1" r="3.5"/><circle class="dot" cx="124.5" cy="141.1" r="3.5"/><circle class="dot" cx="173.1" cy="161.2" r="3.5"/><circle class="dot" cx="221.6" cy="181.6" r="3.5"/><circle class="dot" cx="270.2" cy="201.4" r="3.5"/><circle class="dot" cx="318.7" cy="221.5" r="3.5"/><circle class="dot" cx="367.3" cy="241.7" r="3.5"/><circle class="dot" cx="415.8" cy="260.6" r="3.5"/><circle class="dot" cx="464.4" cy="282.8" r="3.5"/><circle class="dot" cx="512.9" cy="305.8" r="3.5"/><circle class="dot" cx="561.5" cy="321.6" r="3.5"/><circle class="dot" cx="610.0" cy="354.5" r="3.5"/><text class="lb accent" x="619.0" y="358.5">Simulated</text><text class="lb accent" x="619.0" y="373.5">key rate</text><text class="tk mut" x="76" y="436">SIMULATION — no quantum hardware. Asymptotic single-photon bound; no finite-key effects, no decoy states.</text></svg>
